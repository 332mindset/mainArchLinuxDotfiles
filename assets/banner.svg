<style>
.s{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
.bar{transform-box:fill-box;transform-origin:50% 100%}
@keyframes b0{0%{transform:scaleY(0.18)}50%{transform:scaleY(0.81)}100%{transform:scaleY(0.25)}}.b0{animation:b0 0.98s ease-in-out -0.91s infinite alternate}@keyframes b1{0%{transform:scaleY(0.21)}50%{transform:scaleY(0.60)}100%{transform:scaleY(0.29)}}.b1{animation:b1 1.09s ease-in-out -0.31s infinite alternate}@keyframes b2{0%{transform:scaleY(0.26)}50%{transform:scaleY(0.67)}100%{transform:scaleY(0.36)}}.b2{animation:b2 0.70s ease-in-out -1.02s infinite alternate}@keyframes b3{0%{transform:scaleY(0.32)}50%{transform:scaleY(0.81)}100%{transform:scaleY(0.45)}}.b3{animation:b3 0.84s ease-in-out -0.94s infinite alternate}@keyframes b4{0%{transform:scaleY(0.34)}50%{transform:scaleY(1.00)}100%{transform:scaleY(0.48)}}.b4{animation:b4 0.96s ease-in-out -0.48s infinite alternate}@keyframes b5{0%{transform:scaleY(0.33)}50%{transform:scaleY(0.86)}100%{transform:scaleY(0.46)}}.b5{animation:b5 0.62s ease-in-out -0.65s infinite alternate}@keyframes b6{0%{transform:scaleY(0.25)}50%{transform:scaleY(0.66)}100%{transform:scaleY(0.35)}}.b6{animation:b6 1.06s ease-in-out -0.28s infinite alternate}@keyframes b7{0%{transform:scaleY(0.26)}50%{transform:scaleY(0.82)}100%{transform:scaleY(0.37)}}.b7{animation:b7 0.76s ease-in-out -0.75s infinite alternate}@keyframes b8{0%{transform:scaleY(0.33)}50%{transform:scaleY(0.81)}100%{transform:scaleY(0.47)}}.b8{animation:b8 1.01s ease-in-out -1.26s infinite alternate}@keyframes b9{0%{transform:scaleY(0.28)}50%{transform:scaleY(0.75)}100%{transform:scaleY(0.39)}}.b9{animation:b9 1.05s ease-in-out -0.61s infinite alternate}@keyframes b10{0%{transform:scaleY(0.22)}50%{transform:scaleY(0.88)}100%{transform:scaleY(0.31)}}.b10{animation:b10 0.57s ease-in-out -0.82s infinite alternate}@keyframes b11{0%{transform:scaleY(0.15)}50%{transform:scaleY(0.75)}100%{transform:scaleY(0.21)}}.b11{animation:b11 1.21s ease-in-out -1.00s infinite alternate}@keyframes b12{0%{transform:scaleY(0.31)}50%{transform:scaleY(0.95)}100%{transform:scaleY(0.44)}}.b12{animation:b12 0.80s ease-in-out -1.01s infinite alternate}@keyframes b13{0%{transform:scaleY(0.12)}50%{transform:scaleY(0.69)}100%{transform:scaleY(0.17)}}.b13{animation:b13 0.83s ease-in-out -0.50s infinite alternate}@keyframes b14{0%{transform:scaleY(0.34)}50%{transform:scaleY(0.68)}100%{transform:scaleY(0.48)}}.b14{animation:b14 0.57s ease-in-out -0.92s infinite alternate}@keyframes b15{0%{transform:scaleY(0.21)}50%{transform:scaleY(0.64)}100%{transform:scaleY(0.29)}}.b15{animation:b15 0.64s ease-in-out -1.18s infinite alternate}@keyframes b16{0%{transform:scaleY(0.32)}50%{transform:scaleY(0.76)}100%{transform:scaleY(0.44)}}.b16{animation:b16 0.91s ease-in-out -0.30s infinite alternate}@keyframes b17{0%{transform:scaleY(0.27)}50%{transform:scaleY(0.74)}100%{transform:scaleY(0.38)}}.b17{animation:b17 0.63s ease-in-out -0.75s infinite alternate}@keyframes b18{0%{transform:scaleY(0.15)}50%{transform:scaleY(0.95)}100%{transform:scaleY(0.21)}}.b18{animation:b18 0.81s ease-in-out -0.80s infinite alternate}@keyframes b19{0%{transform:scaleY(0.33)}50%{transform:scaleY(0.73)}100%{transform:scaleY(0.46)}}.b19{animation:b19 0.91s ease-in-out -0.54s infinite alternate}@keyframes b20{0%{transform:scaleY(0.29)}50%{transform:scaleY(0.74)}100%{transform:scaleY(0.41)}}.b20{animation:b20 1.00s ease-in-out -0.04s infinite alternate}@keyframes b21{0%{transform:scaleY(0.12)}50%{transform:scaleY(0.64)}100%{transform:scaleY(0.17)}}.b21{animation:b21 1.21s ease-in-out -0.54s infinite alternate}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sun{animation:float 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
.halo{animation:breathe 5s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}
.m1{animation:drift 9s ease-in-out infinite} .m2{animation:drift 12s ease-in-out -3s infinite reverse} .m3{animation:drift 15s ease-in-out -6s infinite}
@keyframes sweep{from{transform:translateX(-300px) skewX(-18deg)}to{transform:translateX(1500px) skewX(-18deg)}}
.sweep{animation:sweep 7s cubic-bezier(.5,0,.5,1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.caret{animation:blink 1s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.r1{animation:rise .9s cubic-bezier(.2,.7,.2,1) both} .r2{animation:rise .9s cubic-bezier(.2,.7,.2,1) .15s both} .r3{animation:rise .9s cubic-bezier(.2,.7,.2,1) .3s both} .r4{animation:rise .9s cubic-bezier(.2,.7,.2,1) .45s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
