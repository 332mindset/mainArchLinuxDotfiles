# Catppuccin Mocha glass lock screen: blurred desktop, clock, Elliot and now playing.
$font   = JetBrainsMono Nerd Font
$photo  = ~/.config/hypr/assets/hyprlock/elliot.jpeg
$music  = ~/.config/hypr/scripts/lock-music.sh

$text     = rgba(cdd6f4ff)
$subtext  = rgba(a6adc8ff)
$overlay  = rgba(7f849cff)
$mauve    = rgba(cba6f7ff)
$blue     = rgba(89b4faff)
$glass    = rgba(1e1e2e73)
$edge     = rgba(cdd6f41f)

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 3, smooth
}

background {
    monitor =
    path = screenshot
    color = rgba(11111bff)
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
}

# ---- Clock ------------------------------------------------------------------

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 120
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(11111b99)
    position = 0, 270
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %-d"
    color = $mauve
    font_size = 16
    font_family = $font Medium
    position = 0, 175
    halign = center
    valign = center
}

# ---- Elliot -----------------------------------------------------------------

image {
    monitor =
    path = $photo
    size = 150
    rounding = -1
    border_size = 3
    border_color = $mauve $blue 45deg
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(11111bcc)
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = <i>hello, friend.</i>
    color = $subtext
    font_size = 13
    font_family = $font
    position = 0, -75
    halign = center
    valign = center
}

# ---- Password ---------------------------------------------------------------

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    outer_color = $mauve $blue 45deg
    inner_color = $glass
    font_color = $text
    check_color = rgba(a6e3a1ff) rgba(94e2d5ff) 45deg
    fail_color = rgba(f38ba8ff) rgba(eba0acff) 45deg
    capslock_color = rgba(f9e2afff)
    font_family = $font
    placeholder_text = <span foreground="##7f849c">󰌾  password</span>
    check_text = <span foreground="##a6e3a1">checking…</span>
    fail_text = <span foreground="##f38ba8">$FAIL</span>
    fade_on_empty = false
    rounding = 16
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(11111b99)
    position = 0, -145
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌌  $LAYOUT[EN,RU]
    color = $overlay
    font_size = 10
    font_family = $font
    position = 0, -192
    halign = center
    valign = center
}

# ---- Now playing (bottom left) ----------------------------------------------

shape {
    monitor =
    size = 520, 112
    color = $glass
    rounding = 20
    border_size = 1
    border_color = $edge
    position = 40, 40
    halign = left
    valign = bottom
}

image {
    monitor =
    path = ~/.cache/hyprlock-music/placeholder.png
    reload_cmd = $music art
    reload_time = 2
    size = 80
    rounding = 14
    border_size = 0
    position = 56, 56
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰎆  now playing
    color = $mauve
    font_size = 9
    font_family = $font Bold
    position = 152, 116
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] $music title
    color = $text
    font_size = 13
    font_family = $font Bold
    position = 152, 88
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] $music artist
    color = $subtext
    font_size = 10
    font_family = $font
    position = 152, 66
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰒮
    color = $subtext
    font_size = 16
    font_family = $font
    onclick = playerctl previous
    position = 424, 64
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:500] $music status
    color = $mauve
    font_size = 18
    font_family = $font
    onclick = playerctl play-pause
    position = 456, 62
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰒭
    color = $subtext
    font_size = 16
    font_family = $font
    onclick = playerctl next
    position = 492, 64
    halign = left
    valign = bottom
}
