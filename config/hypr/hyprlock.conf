# Minimal grayscale theme matching Waybar, Rofi and Hyprland.
$font = JetBrainsMono Nerd Font
$photo = @HOME@/.config/hypr/assets/hyprlock/elliot.jpeg
$foreground = rgba(e2e2e2ff)
$muted = rgba(919191ff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 3, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 3, smooth
}

background {
    monitor =
    color = rgba(181818ff)
}

label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 60
    font_family = $font
    position = 0, 225
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_ALL=C date +"%A, %-d %B"
    color = $muted
    font_size = 12
    font_family = $font
    position = 0, 153
    halign = center
    valign = center
}

image {
    monitor =
    path = $photo
    size = 180
    rounding = 16
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1
    outer_color = rgba(606060ff)
    inner_color = rgba(202020ff)
    font_color = $foreground
    check_color = rgba(d4d4d4ff)
    fail_color = rgba(c8c8c8ff)
    capslock_color = rgba(e2e2e2ff)
    font_family = $font
    placeholder_text = <span foreground="##919191">Password</span>
    check_text = <span foreground="##d4d4d4">Checking…</span>
    fail_text = <span foreground="##c8c8c8">Incorrect password</span>
    fade_on_empty = false
    rounding = 16
    dots_size = 0.20
    dots_spacing = 0.30
    dots_center = true
    position = 0, -155
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = $muted
    font_size = 10
    font_family = $font
    position = 0, -204
    halign = center
    valign = center
}
