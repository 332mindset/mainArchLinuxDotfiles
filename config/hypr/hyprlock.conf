# Static colour palette for Hyprlock; edit this file directly.
# Glass lock screen: blurred desktop, clock, Elliot and now playing.
$font   = Iosevka Nerd Font
$photo  = ~/.config/hypr/assets/hyprlock/elliot.jpeg
$music  = ~/.config/hypr/scripts/lock-music.sh

$text     = rgba(e2e2e2ff)
$subtext  = rgba(c6c6c6ff)
$overlay  = rgba(919191ff)
$mauve    = rgba(ffffffff)
$blue     = rgba(e2e2e2ff)
$glass    = rgba(13131373)
$edge     = rgba(e2e2e21f)

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 3, smooth
}

background {
    monitor =
    path = screenshot
    color = rgba(0e0e0eff)
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
}

# ---- Clock ------------------------------------------------------------------

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 120
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0e0e0e99)
    position = 0, 270
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %-d"
    color = $mauve
    font_size = 18
    font_family = $font Medium
    position = 0, 175
    halign = center
    valign = center
}

# ---- Elliot -----------------------------------------------------------------

image {
    monitor =
    path = $photo
    size = 150
    rounding = -1
    border_size = 3
    border_color = $mauve $blue 45deg
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0e0e0ecc)
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = <i>hello, friend.</i>
    color = $subtext
    font_size = 15
    font_family = $font
    position = 0, -75
    halign = center
    valign = center
}

# ---- Password ---------------------------------------------------------------

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    outer_color = $mauve $blue 45deg
    inner_color = $glass
    font_color = $text
    check_color = rgba(c6c6c6ff) rgba(c6c6c6ff) 45deg
    fail_color = rgba(e2e2e2ff) rgba(e2e2e2ff) 45deg
    capslock_color = rgba(c6c6c6ff)
    font_family = $font
    placeholder_text = <span foreground="##919191">󰌾  password</span>
    check_text = <span foreground="##c6c6c6">checking…</span>
    fail_text = <span foreground="##e2e2e2">$FAIL</span>
    fade_on_empty = false
    rounding = 16
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0e0e0e99)
    position = 0, -145
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌌  $LAYOUT[EN,RU]
    color = $overlay
    font_size = 12
    font_family = $font
    position = 0, -192
    halign = center
    valign = center
}

# ---- Now playing (bottom left) ----------------------------------------------

shape {
    monitor =
    size = 520, 112
    color = $glass
    rounding = 20
    border_size = 1
    border_color = $edge
    position = 40, 40
    halign = left
    valign = bottom
}

image {
    monitor =
    path = ~/.cache/hyprlock-music/placeholder.png
    reload_cmd = $music art
    reload_time = 2
    size = 80
    rounding = 14
    border_size = 0
    position = 56, 56
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰎆  now playing
    color = $mauve
    font_size = 11
    font_family = $font Bold
    position = 152, 116
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] $music title
    color = $text
    font_size = 15
    font_family = $font Bold
    position = 152, 88
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] $music artist
    color = $subtext
    font_size = 12
    font_family = $font
    position = 152, 66
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰒮
    color = $subtext
    font_size = 18
    font_family = $font
    onclick = playerctl previous
    position = 424, 64
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:500] $music status
    color = $mauve
    font_size = 20
    font_family = $font
    onclick = playerctl play-pause
    position = 456, 62
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰒭
    color = $subtext
    font_size = 18
    font_family = $font
    onclick = playerctl next
    position = 492, 64
    halign = left
    valign = bottom
}
