# Catppuccin Mocha theme matching Waybar, Rofi and Hyprland.
$font = JetBrainsMono Nerd Font
$photo = @HOME@/.config/hypr/assets/hyprlock/elliot.jpeg
$foreground = rgba(cdd6f4ff)
$muted = rgba(a6adc8ff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 3, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 3, smooth
}

background {
    monitor =
    color = rgba(1e1e2eff)
}

label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 60
    font_family = $font
    position = 0, 225
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_ALL=C date +"%A, %-d %B"
    color = $muted
    font_size = 12
    font_family = $font
    position = 0, 153
    halign = center
    valign = center
}

image {
    monitor =
    path = $photo
    size = 180
    rounding = 16
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    outer_color = rgba(cba6f7ff) rgba(89b4faff) 45deg
    inner_color = rgba(313244ff)
    font_color = $foreground
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    capslock_color = rgba(f9e2afff)
    font_family = $font
    placeholder_text = <span foreground="##a6adc8">Password</span>
    check_text = <span foreground="##a6e3a1">Checking…</span>
    fail_text = <span foreground="##f38ba8">Incorrect password</span>
    fade_on_empty = false
    rounding = 16
    dots_size = 0.20
    dots_spacing = 0.30
    dots_center = true
    position = 0, -155
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = $muted
    font_size = 10
    font_family = $font
    position = 0, -204
    halign = center
    valign = center
}
