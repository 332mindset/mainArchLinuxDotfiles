# Colours from the wallpaper: wallpaper_picker.py runs
#   matugen image <wallpaper> --source-color-index 0 -t scheme-monochrome
# after every change. Edit the templates, not the generated files.

[config]

# Terminal/status hues, nudged towards the wallpaper's source colour.
[config.custom_colors]
red     = "#e05561"
green   = "#8cc265"
yellow  = "#d8b34a"
blue    = "#4aa5f0"
magenta = "#c162de"
cyan    = "#42b3c2"
orange  = "#e8875a"

[templates.waybar]
input_path  = "~/.config/matugen/templates/waybar.css"
output_path = "~/.config/waybar/matugen.css"
post_hook   = "pkill -USR2 -x waybar || true"

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/matugen.conf"
post_hook   = "pkill -USR1 -x kitty || true"

[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/themes/matugen-colors.rasi"

[templates.swaync]
input_path  = "~/.config/matugen/templates/swaync.css"
output_path = "~/.config/swaync/style.css"
post_hook   = "swaync-client -rs >/dev/null 2>&1 || true"

[templates.hyprlock]
input_path  = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/hyprlock.conf"

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook   = "hyprctl reload >/dev/null 2>&1 || true"

[templates.firefox]
input_path  = "~/.config/matugen/templates/firefox.css"
output_path = "~/.config/mozilla/firefox/x2jxc7ku.default-release/chrome/matugen.css"
