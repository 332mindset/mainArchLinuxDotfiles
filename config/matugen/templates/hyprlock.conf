# Generated by matugen — edit ~/.config/matugen/templates/hyprlock.conf
# Glass lock screen: blurred desktop, clock, Elliot and now playing.
$font   = Iosevka Nerd Font
$photo  = ~/.config/hypr/assets/hyprlock/elliot.jpeg
$music  = ~/.config/hypr/scripts/lock-music.sh

$text     = rgba({{colors.on_surface.default.hex_stripped}}ff)
$subtext  = rgba({{colors.on_surface_variant.default.hex_stripped}}ff)
$overlay  = rgba({{colors.outline.default.hex_stripped}}ff)
$mauve    = rgba({{colors.primary.default.hex_stripped}}ff)
$blue     = rgba({{colors.tertiary.default.hex_stripped}}ff)
$glass    = rgba({{colors.surface.default.hex_stripped}}73)
$edge     = rgba({{colors.on_surface.default.hex_stripped}}1f)

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 3, smooth
}

background {
    monitor =
    path = screenshot
    color = rgba({{colors.surface_container_lowest.default.hex_stripped}}ff)
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
}

# ---- Clock ------------------------------------------------------------------

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 120
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba({{colors.surface_container_lowest.default.hex_stripped}}99)
    position = 0, 270
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %-d"
    color = $mauve
    font_size = 18
    font_family = $font Medium
    position = 0, 175
    halign = center
    valign = center
}

# ---- Elliot -----------------------------------------------------------------

image {
    monitor =
    path = $photo
    size = 150
    rounding = -1
    border_size = 3
    border_color = $mauve $blue 45deg
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba({{colors.surface_container_lowest.default.hex_stripped}}cc)
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = <i>hello, friend.</i>
    color = $subtext
    font_size = 15
    font_family = $font
    position = 0, -75
    halign = center
    valign = center
}

# ---- Password ---------------------------------------------------------------

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    outer_color = $mauve $blue 45deg
    inner_color = $glass
    font_color = $text
    check_color = rgba({{colors.on_surface_variant.default.hex_stripped}}ff) rgba({{colors.on_surface_variant.default.hex_stripped}}ff) 45deg
    fail_color = rgba({{colors.on_surface.default.hex_stripped}}ff) rgba({{colors.tertiary.default.hex_stripped}}ff) 45deg
    capslock_color = rgba({{colors.on_surface_variant.default.hex_stripped}}ff)
    font_family = $font
    placeholder_text = <span foreground="##{{colors.outline.default.hex_stripped}}">󰌾  password</span>
    check_text = <span foreground="##{{colors.on_surface_variant.default.hex_stripped}}">checking…</span>
    fail_text = <span foreground="##{{colors.on_surface.default.hex_stripped}}">$FAIL</span>
    fade_on_empty = false
    rounding = 16
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba({{colors.surface_container_lowest.default.hex_stripped}}99)
    position = 0, -145
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌌  $LAYOUT[EN,RU]
    color = $overlay
    font_size = 12
    font_family = $font
    position = 0, -192
    halign = center
    valign = center
}

# ---- Now playing (bottom left) ----------------------------------------------

shape {
    monitor =
    size = 520, 112
    color = $glass
    rounding = 20
    border_size = 1
    border_color = $edge
    position = 40, 40
    halign = left
    valign = bottom
}

image {
    monitor =
    path = ~/.cache/hyprlock-music/placeholder.png
    reload_cmd = $music art
    reload_time = 2
    size = 80
    rounding = 14
    border_size = 0
    position = 56, 56
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰎆  now playing
    color = $mauve
    font_size = 11
    font_family = $font Bold
    position = 152, 116
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] $music title
    color = $text
    font_size = 15
    font_family = $font Bold
    position = 152, 88
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] $music artist
    color = $subtext
    font_size = 12
    font_family = $font
    position = 152, 66
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰒮
    color = $subtext
    font_size = 18
    font_family = $font
    onclick = playerctl previous
    position = 424, 64
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:500] $music status
    color = $mauve
    font_size = 20
    font_family = $font
    onclick = playerctl play-pause
    position = 456, 62
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰒭
    color = $subtext
    font_size = 18
    font_family = $font
    onclick = playerctl next
    position = 492, 64
    halign = left
    valign = bottom
}
